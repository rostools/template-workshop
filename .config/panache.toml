flavor = "quarto"
extend-exclude = [".github/", "README.md"]
extend-include = [
  "*.md\\{% endif %\\}.jinja",
  "*.qmd\\{% endif %\\}.jinja",
  "*.md.jinja",
  "*.qmd.jinja",
]

[format]
tab-width = 2

[linters]
r = "jarl"
python = "ruff"
rust = "clippy"

[formatters]
r = "air"
python = "ruff"
rust = "rustfmt"
